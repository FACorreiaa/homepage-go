services:
  app:
    build:
      context: .
    image: facorreia-site-go:latest
    ports:
      # Published on all interfaces at the Docker level, but external access
      # to :8090 is dropped by a DOCKER-USER iptables rule (see
      # deploy/harden/ and harden-server.sh). A 127.0.0.1 bind here triggers
      # a userland-proxy "address already in use" bug on this host, so the
      # firewall rule is the reliable way to keep the app port private.
      - "8090:8090"
    volumes:
      - studio_data:/var/lib/facorreia-site
      - ${HOST_VAULT_PATH:-/opt/facorreia-site-go/vault}:/app/vault:ro
    restart: unless-stopped

volumes:
  studio_data:
