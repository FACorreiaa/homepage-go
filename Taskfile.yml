version: "3"

tasks:
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8090" --cmd="go run ." --open-browser=false

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - |
        TEMPLUI_PATH="$(go list -mod=mod -m -f {{`'{{.Dir}}'`}} github.com/templui/templui)" && \
        printf '%s\n' \
          '@source "./**/*.templ";' \
          '@source "./assets/static/*.js";' \
          "@source \"$TEMPLUI_PATH/components/button/**/*.templ\";" \
          "@source \"$TEMPLUI_PATH/components/icon/**/*.templ\";" \
          > ./assets/css/sources.generated.css && \
        tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --watch

  sqlc:
    desc: Generate sqlc code
    cmds:
      - go tool sqlc generate

  hooks:
    desc: Install versioned git hooks (.githooks → core.hooksPath)
    cmds:
      - bash scripts/install-hooks.sh

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go sources with gofumpt
    cmds:
      - go tool gofumpt -w .

  dev:
    desc: Start development server with hot reload
    cmds:
      - task --parallel tailwind templ
