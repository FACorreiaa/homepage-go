# Replaces the SSH docker-compose deploy (deploy.yml): build the image, push
# to GHCR, and point the k3s deployment at it by committing the new tag into
# LuminaVaultInfra (ArgoCD does the rest). Requires the INFRA_TOKEN secret —
# a PAT with contents:write on LuminaVault/LuminaVaultInfra.
name: Build and Push

on:
  push:
    branches: [main]
    # Every run of this workflow rolls production, and the rollout is Recreate
    # (ReadWriteOnce PVC), so it always costs ~20-40s of downtime. Skip it when
    # a push changes nothing the image contains. A push that touches docs *and*
    # code still builds — the filter only skips when every changed file matches.
    #
    # Trade-off: a docs-only commit gets no image, so its SHA is not a rollback
    # target. Roll back to the last SHA that actually built.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/facorreiaa/homepage-go:${{ github.sha }}
            ghcr.io/facorreiaa/homepage-go:latest

      - name: Bump image tag in LuminaVaultInfra
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/LuminaVault/LuminaVaultInfra.git" infra
          cd infra
          sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA} # CI overwrites with the git SHA on each main push|" apps/isis/values.yaml
          git config user.name "facorreia-ci"
          git config user.email "fernandocorreia316@gmail.com"
          git commit -am "isis → ${GITHUB_SHA:0:12} (homepage-go@${GITHUB_SHA})"
          git push
