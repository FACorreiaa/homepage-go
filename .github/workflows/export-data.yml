# One-off migration helper: export the studio_data volume + vault from the old
# VPS as an encrypted artifact (the runner can SSH in; the admin IP cannot).
# Delete this workflow after the k3s cutover is verified.
name: Export VPS Data

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Export data (brief app stop for SQLite consistency)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<'REMOTE' > migration.tgz
          set -euo pipefail
          cd /opt/facorreia-site-go
          VOL=$(docker volume ls -q | grep studio_data | head -1)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml stop app 1>&2
          docker run --rm \
            -v "$VOL":/export/studio:ro \
            -v /opt/facorreia-site-go/vault:/export/vault:ro \
            alpine tar czf - -C /export studio vault
          docker compose -f docker-compose.yml -f docker-compose.prod.yml start app 1>&2
          REMOTE
          ls -la migration.tgz

      - name: Encrypt
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass "pass:${{ secrets.MIGRATION_KEY }}" \
            -in migration.tgz -out migration.tgz.enc
          rm migration.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: vps-data
          path: migration.tgz.enc
          retention-days: 1
