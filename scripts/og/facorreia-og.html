<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FC2S OG</title>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("../../assets/fonts/geist/geist-variable.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("../../assets/fonts/geist/geist-mono-variable.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #111111;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      color: #f5f5f4;
      font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 640px 420px at 100% 0%, oklch(0.72 0.13 72 / 12%), transparent 58%),
        #111111;
    }
    .inner {
      height: 100%;
      display: grid;
      grid-template-columns: 168px 1fr;
      column-gap: 48px;
      align-items: center;
    }
    .stamp {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      place-items: center;
      width: 168px;
      height: 168px;
      border-radius: 28px;
      background: #f5f5f4;
      color: #111111;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .copy { min-width: 0; }
    .kicker {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgb(245 245 244 / 52%);
    }
    .wordmark {
      margin-top: 18px;
      font-size: 76px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 0.86;
    }
    .wordmark span { color: oklch(0.72 0.13 72); }
    .sub {
      margin-top: 28px;
      max-width: 34rem;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: rgb(245 245 244 / 72%);
    }
    .foot {
      margin-top: 28px;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 16px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgb(245 245 244 / 48%);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="stamp" aria-hidden="true">
        <span>F</span><span>C</span><span>2</span><span>S</span>
      </div>
      <div class="copy">
        <p class="kicker">Porto, PT / Solo practice</p>
        <h1 class="wordmark">Fernando <span>Correia</span></h1>
        <p class="sub">One engineer, the whole stack, in production.</p>
        <p class="foot">facorreia.com</p>
      </div>
    </div>
  </div>
</body>
</html>
